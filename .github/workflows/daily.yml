name: Daily market data

on:
  schedule:
    # Mon–Fri 19:35 IST (14:05 UTC), retry at 21:35 IST in case NSE files were late
    - cron: '5 14 * * 1-5'
    - cron: '5 16 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/daily.yml', 'data/universe.csv']

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch new NSE files
        run: python scripts/update.py
      - name: Compute dashboard data
        run: python scripts/compute.py
      - name: Commit
        run: |
          git config user.name "market-breadth-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data public/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
