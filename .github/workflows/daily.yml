name: Daily market data

on:
  schedule:
    # GitHub's scheduler is best-effort and often runs late, so the job is attempted several
    # times each evening (IST) plus a next-morning catch-up. Runs are idempotent: each one
    # only adds trading days that are still missing.
    - cron: '20 13 * * 1-5'   # 18:50 IST
    - cron: '5 14 * * 1-5'    # 19:35 IST
    - cron: '50 14 * * 1-5'   # 20:20 IST
    - cron: '35 15 * * 1-5'   # 21:05 IST
    - cron: '5 17 * * 1-5'    # 22:35 IST
    - cron: '45 1 * * 2-6'    # 07:15 IST next morning (catch-up)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/daily.yml', 'data/universe.csv']

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch new NSE files
        run: python scripts/update.py
      - name: Compute dashboard data
        run: python scripts/compute.py
      - name: Commit
        run: |
          git config user.name "market-breadth-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data public/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
